name: Démos publiques

on:
  schedule:
    - cron: '17 2 * * *'   # nocturne, decale de l'heure ronde (02:17 UTC)
  workflow_dispatch: {}   # relance manuelle (verification du mecanisme d'alerte, ou a la demande)
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - 'playwright.config.js'
      - '.github/workflows/demos.yml'
  pull_request:
    paths:
      - 'tests/**'
      - 'playwright.config.js'
      - '.github/workflows/demos.yml'

jobs:
  demos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      issues: write   # alerte nocturne uniquement (voir plus bas) -- jamais Redmine, jamais de config modifiée
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-playwright
          path: |
            rapport-html/
            rapport.json
          retention-days: 14
      # Alerte visible uniquement pour le passage NOCTURNE programmé (jamais sur une PR, où
      # l'échec est déjà visible dans la PR elle-même) -- une issue GitHub, jamais Redmine ni une
      # modification de configuration (demande larose75 08/11/2026). Une seule issue à la fois
      # (label nightly-failure) : les échecs suivants ajoutent un commentaire au lieu d'en
      # recréer une, et le prochain run réussi la ferme automatiquement.
      - name: Alerte nocturne si échec (issue GitHub)
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v7
        with:
          script: |
            const lien = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'nightly-failure',
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issues[0].number,
                body: `Échec à nouveau cette nuit : ${lien}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'Passage nocturne en échec',
                labels: ['nightly-failure'],
                body: `Le passage nocturne programmé a échoué.\n\nDétail : ${lien}\n\nFermée automatiquement au prochain passage nocturne réussi.`,
              });
            }
      - name: Fermer l'alerte nocturne si le run réussit
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v7
        with:
          script: |
            const lien = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'nightly-failure',
            });
            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                body: `Passage nocturne de nouveau vert : ${lien}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: 'closed',
              });
            }
